services:
  app:
    build: .
    restart: always
    ports:
      - "3001:3001"
    env_file:
      - .env
    depends_on:
      - redis
      - rabbitmq
    networks:
      - backend
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - backend
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - backend
    
  prom-server:
    image: prom/prometheus
    container_name: prometheus
    ports:
      - "9095:9090"
    volumes:
      - ./prometheus-config.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - app
    networks:
      - backend

networks:
  backend:
    driver: bridge
